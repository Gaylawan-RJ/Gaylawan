<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Gaylawan Contact</title>
  <link rel="stylesheet" type="text/css" href="design2.css" />
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Roboto", sans-serif;
    }
  </style>
</head>
<header>
  <nav>
    <ul>
      <li><a href="main.html">Home</a></li>
      <li><a href="about.html">About me</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="skill.html">Skill/Talent</a></li>
    </ul>
  </nav>
  <div class="hero">
    <h1>Contact Me</h1>
    <p>Reach out to me if you have any questions or would like to work together.</p>
    <a href="#" class="button">Get in Touch</a>
  </div>
</header>

<section class="contact-form py-16 bg-gray-100">
  <div class="container mx-auto px-4">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
      <h2 class="text-2xl font-bold mb-4 text-center">Get in Touch</h2>
      <form>
        <div class="mb-4">
          <label for="name" class="block text-gray-700 font-bold mb-2">
            Name:
          </label>
          <input
            type="text"
            id="name"
            name="name"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            required
          />
        </div>
        <div class="mb-4">
          <label for="email" class="block text-gray-700 font-bold mb-2">
            Email:
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            required
          />
        </div>
        <div class="mb-6">
          <label for="message" class="block text-gray-700 font-bold mb-2">
            Message:
          </label>
          <textarea
            id="message"
            name="message"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            required
          ></textarea>
        </div>
        <div class="flex items-center justify-center">
          <button
            type="submit"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus-shadow-outline"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<footer>
  <p>&copy; Ronald James Gaylawan</p>
</footer>

<script
  src="https://kit.fontawesome.com/your-font-awesome-kit.js"
  crossorigin="anonymous"
></script>
</body>
</html>
